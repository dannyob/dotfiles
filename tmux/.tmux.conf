# --- General Settings ---
set -g mouse on
setw -g mode-keys vi
set -g history-limit 10000

# --- Prefix Change ---
# Change prefix from 'Ctrl-b' to 'Ctrl-a' (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- Custom Bindings ---

# Better Detach (mnemonic: 'q' for quit/quit session view)
# Note: By default 'd' is detach, but 'q' is often used for 'quit' in other apps
bind q detach-client

# Visual Splits (mnemonic: | for vertical, - for horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Easier Pane Navigation (Vim-style h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast Reload (mnemonic: 'r' for reload)
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# --- Appearance ---
set -g status-bg black
set -g status-fg white
set -g status-left-length 30
set -g status-right '#[fg=yellow]%H:%M #[fg=green]%d-%b-%y'
