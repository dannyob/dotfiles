[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{DESCRIPTION}}"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.scripts]
{{PROJECT_NAME}} = "{{PACKAGE_NAME}}.cli:cli"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
